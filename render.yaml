# Render blueprint. Point Render at this repo and it reads the settings from
# here instead of you filling the dashboard form by hand.
#
# The two Supabase values are marked sync:false, so Render asks for them once
# and keeps them out of the repository.
services:
  - type: web
    name: rf-mapping-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn database.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FLASK_DEBUG
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: mapping-files
